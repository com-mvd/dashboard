<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Dashboard COM</title>
<link rel="icon" type="image/png" href="assets/logo-ciemsa.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script defer src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.mini.min.js"></script>
<style>
/* Informes de los programas por municipio y barrio (24/11/2026). Junta los tableros que antes eran
   barrios-sustentables-cerro.html y bolsones-edificio-im.html (esos archivos ahora redirigen acá).
   Menú en árbol: MUNICIPIO → BARRIO → PROGRAMA. Para sumar un programa: agregarlo en ARBOL (abajo)
   con su función de dibujo en PROGRAMAS. */
:root{
  --bg:#F7F6F3; --card:#FFFFFF; --border:#E6E2DA; --border2:#D0CBC3;
  --text:#1A1714; --text2:#5F5A54; --text3:#9A948C;
  --azul:#1b3f74; --rojo:#c0392b; --verde:#1baf7a; --teal:#39745E;
  --rama:#CFC9BF;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
  --shadow-hover:0 12px 32px rgba(26,23,20,.10),0 2px 6px rgba(26,23,20,.06);
  --r:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{scrollbar-gutter:stable}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  background:radial-gradient(circle at 12% 0%,#EDEEF9 0%,transparent 40%),radial-gradient(circle at 95% 100%,#E7F3EE 0%,transparent 40%),var(--bg);
  background-attachment:fixed;min-height:100vh}
button{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:1.5rem clamp(16px,2.5vw,2rem) 3rem;display:flex;flex-direction:column;gap:14px}
.num{font-variant-numeric:tabular-nums}

/* ── Menú: título y árbol ── */
.menu{max-width:900px;margin:0 auto;padding:clamp(2.5rem,8vh,5rem) 16px 4rem}
.headline{text-align:center;font-size:clamp(30px,6vw,52px);font-weight:700;letter-spacing:-1.3px;line-height:1.08;text-wrap:balance}
.rule{width:42px;height:3px;border-radius:2px;background:var(--azul);margin:1.5rem auto 2.6rem}

/* Árbol: cada nivel cuelga de una rama vertical, con un tramo horizontal hasta cada nodo */
.arbol,.arbol ul{list-style:none}
.arbol{--espacio-rama:12px;display:flex;flex-direction:column;gap:18px;width:min(100%,600px);margin:0 auto}
@media (min-width:761px){
  .menu{padding:clamp(2rem,6vh,4rem) 16px 2.5rem}
  .rule{margin:1.25rem auto 2rem}
  .arbol{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;gap:clamp(18px,4vw,40px);width:100%}
}
.arbol ul{position:relative;margin-left:22px;padding-left:28px}
.arbol ul>li{position:relative;padding-top:var(--espacio-rama)}
.arbol ul>li::before{content:'';position:absolute;left:-28px;top:0;bottom:0;border-left:2px solid var(--rama)}
.arbol ul>li:last-child::before{bottom:auto;height:calc(var(--espacio-rama) + var(--mitad,22px))}
.arbol ul>li::after{content:'';position:absolute;left:-28px;top:calc(var(--espacio-rama) + var(--mitad,22px));right:100%;border-top:2px solid var(--rama)}

.nodo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:10px 16px;min-height:44px}
.arbol .eti{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text3)}
.nodo .nom{font-weight:700;font-size:16px}
.nodo .txt{display:flex;flex-direction:column;gap:1px;min-width:0}
.munic{--mitad:26px;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);border:0;color:#fff;min-height:52px;width:fit-content;padding:10px 20px}
.munic .eti{color:#9fb3cf}
.munic .nom{font-size:18px}
.barrio{width:fit-content}
.arbol ul>.rama-programas{--mitad:18px}
.nodo.grupo-programas{display:block;width:min(100%,340px);padding:0;overflow:hidden;border-color:#CBD7E8}
.grupo-programas .eti{display:block;padding:11px 15px;background:linear-gradient(90deg,#DCE7F6,#EFF4FA);border-bottom:1px solid #D7E1EF;color:var(--azul);font-size:11px}
.prog{display:flex;align-items:center;gap:12px;min-height:56px;padding:9px 14px 9px 15px;text-decoration:none}
.prog + .prog{border-top:1px solid #E5EBF4}
.prog:hover,.prog:focus-visible{background:#F0F5FC}
.prog:focus-visible{outline:2px solid var(--azul);outline-offset:-2px}
.prog .nom{font-size:15px}
.prog .det{font-size:12px;color:var(--text2)}
.prog .ir{display:grid;place-items:center;flex:none;width:27px;height:27px;margin-left:auto;border-radius:50%;background:#E5EDF8;color:var(--azul);font-size:20px;line-height:1}
.prog:hover .ir,.prog:focus-visible .ir{background:#D4E2F4}
@media (max-width:560px){
  .arbol ul{margin-left:14px;padding-left:20px}
  .arbol ul>li::before,.arbol ul>li::after{left:-20px}
  .nodo{padding:9px 12px}
}

@media (min-width:761px) and (max-height:900px){
  .menu{padding-block:2rem .75rem}
  .rule{margin:1rem auto 1.4rem}
  .arbol{--espacio-rama:8px}
  .munic{min-height:48px;padding-block:7px}
  .barrio{padding-block:6px}
  .arbol ul>.rama-programas{--mitad:14px}
  .grupo-programas .eti{padding-block:7px}
  .prog{min-height:44px;padding-block:5px}
}

/* ── Barra azul de cada informe ── */
.barra{position:sticky;top:0;z-index:1200;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%);color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.3);padding-top:env(safe-area-inset-top)}
.barra-in{position:relative;max-width:1200px;margin:0 auto;min-height:84px;padding:12px clamp(16px,2.5vw,2rem);display:flex;justify-content:center;align-items:center}
.titulo{display:flex;align-items:center;gap:10px;min-width:0;padding:0 90px}
.titulo .ico{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:28px;height:28px;font-family:'Segoe UI Emoji','Apple Color Emoji','Noto Color Emoji',sans-serif;font-size:23px;line-height:28px}
.titulo h1{font-family:'Segoe UI',Arial,sans-serif;font-size:24px;font-weight:700;letter-spacing:-.01em;line-height:1.15;text-align:center}
.volver{position:absolute;left:clamp(16px,2.5vw,2rem);top:50%;transform:translateY(-50%);display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;text-decoration:none}
.volver:hover{background:rgba(255,255,255,.12)}
.volver .fl{font-size:18px;line-height:1}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:.8rem 1rem;border-bottom:1px solid var(--border)}

/* Mapa con los puntos y su referencia */
.mapa-card{overflow:hidden;isolation:isolate}
#mapa{height:440px;background:#EFEDE8}
.mapa-h{justify-content:center}
.ley{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.lg{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--text2);background:var(--card)}
.lg i,.pt{width:11px;height:11px;border-radius:50%;background:var(--c);flex:none}

/* Indicadores */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.kpi{padding:1rem 1.1rem}
.kpi-n{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.02em}
.kpi-l{font-size:12px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
/* Por punto */
.puntos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.punto{padding:.9rem 1rem;border-left:5px solid var(--c)}
.punto h3{font-size:14.5px;font-weight:700}
.punto .dir{font-size:12px;color:var(--text3);margin-bottom:8px;text-transform:uppercase}
.punto .dir a{color:var(--azul);text-underline-offset:2px}
.punto dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13px}
.punto dt{color:var(--text2)}
.punto dd{font-weight:700;text-align:right}

/* Detalle: sin título; overflow:hidden recorta las cuatro esquinas redondeadas */
.detalle{overflow:hidden}
.tabla-wrap{overflow-x:auto}
.tabla,.descargar-excel{font-size:13.5px}
.tabla{width:100%;border-collapse:collapse;table-layout:fixed}
.tabla th{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;text-align:center;padding:.6rem .9rem;background:#F7F6F3;border-bottom:1px solid var(--border);white-space:nowrap}
.tabla td{padding:.6rem .9rem;border-bottom:1px solid #ECE9E3;color:var(--text2);white-space:nowrap;text-align:center}
.tabla tbody tr:nth-child(even) td{background:#FBFAF8}
.tabla tbody tr:hover td{background:#F3F1EC}
.tabla tbody tr:last-child td{border-bottom:0}
.tabla .ed{display:inline-flex;align-items:center;gap:8px;width:190px;max-width:100%;text-align:left;font-weight:700;color:var(--text)}
.tabla .n{font-weight:700;color:var(--text)}
.tabla .corto{display:none}
@media (max-width:600px){
  .tabla,.descargar-excel{font-size:12px}
  .tabla{table-layout:auto}
  .tabla th,.tabla td{padding:.55rem .35rem;white-space:nowrap}
  .tabla.con-ed th:first-child,.tabla.con-ed td:first-child{text-align:left;padding-left:.7rem}
  .tabla th{letter-spacing:.03em}
  .tabla .ed{width:auto;gap:6px}
  .tabla .largo{display:none}
  .tabla .corto{display:inline}
}
.vacio{text-align:center;color:var(--text3);font-size:14px;padding:1.2rem}
.exportar-detalle{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.excel-estado:empty{display:none}
.excel-estado{color:var(--rojo);font-size:12px}
.descargar-excel{flex:none;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text2);cursor:pointer}
.descargar-excel:hover{background:#F3F1EC;border-color:var(--border2)}
.descargar-excel:focus-visible{outline:2px solid var(--text2);outline-offset:2px}

/* Mientras se leen los datos */
.carga{min-height:max(260px,calc(100vh - 130px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 16px;text-align:center}
.ruedita{width:38px;height:38px;border:3px solid #dbe3ed;border-top-color:#2563eb;border-radius:50%;animation:girar .8s linear infinite}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ruedita{animation-duration:2.4s}}
.carga-t{color:#64748b;font-size:14px;font-weight:600}
.carga-t.error{color:var(--rojo)}
.btn{border:0;border-radius:12px;padding:11px 22px;font-size:15px;font-weight:700;cursor:pointer;color:#fff;background:linear-gradient(135deg,#0f172a 0%,#16213e 55%,#1b3f74 100%)}

@media (max-width:900px){ .puntos{grid-template-columns:1fr} }
@media (max-width:760px){
  .barra-in{padding:10px 16px;min-height:64px}
  .titulo{padding:0 44px}
  .titulo h1{font-size:19px}
  .titulo .ico{width:24px;height:24px;font-size:19px;line-height:24px}
  .volver{left:8px}
  .volver .tx{display:none}
  #mapa{height:360px}
  .kpi-n{font-size:24px}
}
</style>
</head>
<body>

<!-- Menú: Municipio → Barrio → Programa -->
<main class="menu" id="menu" hidden>
  <h1 class="headline">Centro Operativo de Montevideo</h1>
  <div class="rule"></div>
  <ul class="arbol" id="arbol"></ul>
</main>

<!-- Un informe -->
<div id="informe" hidden>
  <header class="barra">
    <div class="barra-in">
      <a class="volver" href="#" title="Volver al menú"><span class="fl">‹</span><span class="tx">Volver</span></a>
      <div class="titulo"><span class="ico" aria-hidden="true" id="infIco">♻</span><h1 id="infTitulo"></h1></div>
    </div>
  </header>

  <div class="carga" id="pantallaCargando" role="status" aria-live="polite">
    <div class="ruedita" id="ruedita"></div>
    <div class="carga-t" id="cargaT">Cargando información</div>
    <button class="btn" type="button" id="reintentar" hidden>Reintentar</button>
  </div>

  <div class="wrap" id="contenido" hidden></div>
</div>

<script>
// ── Datos ──────────────────────────────────────────────────────────────────
// Vaciados de la tabla vaciados de Supabase. Se leen sin login con la clave pública, de la vista vaciados_publico:
// solo edificio, fecha, bolsones > 0 y destino final (desde el 24/11, sql/32 de com2), sin datos personales. Se cargan en COM 2 (panel Admin).
const SUPABASE = 'https://srgduwdvkgqrrmhxpzlx.supabase.co', CLAVE_PUBLICA = 'sb_publishable_8ZP6-05anDJSBy39IwbSdQ_18iWRnd6';
async function leerVaciados(tablero) {
  const res = await fetch(`${SUPABASE}/rest/v1/vaciados_publico?tablero=eq.${tablero}&select=edificio,fecha,bolsones,destino&order=fecha.desc`,
    { headers: { apikey: CLAVE_PUBLICA }, cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return (await res.json()).map(v => ({ edif: v.edificio, fGes: String(v.fecha).slice(0, 16), cant: v.bolsones, destino: v.destino || '' }));
}
const CARTO_KEY = 'cb1_4dpf_1_b2ca9299be611862d5d23c88';

// Puntos de Cerro (tablero 'cerro' de la tabla vaciados; una sola carga en COM 2 para todos). Para sumar un lugar,
// agregarlo acá, en la carga de COM 2 y en vaciados_lugares. Desde el 24/11 las escuelas (escuela: true) son el
// programa "Escuelas Sustentables" y el resto "Barrios Sustentables".
const LUGARES_CERRO = [
  { nombre: 'Plaza Débora Céspedes', edif: 'plaza debora cespedes', dir: 'EGIPTO esq. SUECIA', pos: [-34.881884, -56.24755], color: '#1baf7a' },
  { nombre: 'Federación FOICA', edif: 'federacion foica', dir: 'HOLANDA 1715', pos: [-34.884961, -56.249596], color: '#2a78d6' },
  { nombre: 'Plaza de Deportes N11', edif: 'plaza de deportes n11', dir: 'PORTUGAL esq. AUSTRIA', pos: [-34.881595, -56.252055], color: '#eb6834' },
  { nombre: 'Seccional N24', edif: 'seccional n24', dir: 'PRUSIA 1895', pos: [-34.8873037, -56.2530708], color: '#8b5cf6' },
  { nombre: 'Escuela Luisa Casteran', edif: 'escuela luisa casteran', dir: 'CHINA 1898', pos: [-34.8808973, -56.2541799], color: '#e0457b', escuela: true },
  { nombre: 'Formativas de Rampla', edif: 'formativas de rampla', dir: 'TURQUIA 3335', pos: [-34.8911277, -56.2466996], color: '#d99a00' },
  { nombre: 'Club de Pesca', edif: 'club de pesca', dir: 'GRECIA 3152', pos: [-34.8954891, -56.2470705], color: '#14a3b8' },
  { nombre: 'Escuela N29', edif: 'escuela n29', dir: 'PORTUGAL 3325', pos: [-34.8919223, -56.2500098], color: '#a0663a', escuela: true },
  { nombre: 'Club Verdirrojo', edif: 'club verdirrojo', dir: 'PRUSIA 1621', pos: [-34.8864681, -56.247238], color: '#5b6b82' },
  { nombre: 'TATA Grecia', edif: 'tata grecia', dir: 'GRECIA 3396', pos: [-34.8903134, -56.2479785], color: '#65a30d' },
];
const BARRIOS_CERRO = LUGARES_CERRO.filter(l => !l.escuela), ESCUELAS_CERRO = LUGARES_CERRO.filter(l => l.escuela);
// Puntos de 3 de Abril y Las Torres en el tablero 'cerro'.
const LUGARES_3_DE_ABRIL = [
  { nombre: 'Cooperativa Mesa 4', dir: 'Av. Luis Batlle Berres 5870', pos: [-34.8413503, -56.2575541], color: '#1baf7a', maps: 'https://maps.app.goo.gl/7vGxK8zCFJTGszwt6' },
];
const ESCUELAS_LAS_TORRES = [
  { nombre: 'Escuela 188', dir: 'Camino Cibils 6221 esq. Mirunga', pos: [-34.8451083, -56.2734164], color: '#1baf7a', maps: 'https://maps.app.goo.gl/pcNc56ZNVLujojjh6' },
];
const BARRIOS_LAS_TORRES = [
  { nombre: 'Colegio Centro Infantil Kala – Bethuel', dir: 'Av. Cibils 5878', pos: [-34.848369, -56.2717633], color: '#2a78d6', maps: 'https://maps.app.goo.gl/U8DDcrSh5XoaE9Pq5' },
  { nombre: 'Colegio Kala Infantil', dir: 'Fray Luis de León 2458', pos: [-34.8483125, -56.27343], color: '#eb6834', maps: 'https://maps.app.goo.gl/K1bt6mYEcGQigqLS6' },
  { nombre: 'Sede Social Las Torres Tomkinson', dir: 'Francisco de Quevedo 6081', pos: [-34.8457719, -56.2738365], color: '#8b5cf6', maps: 'https://maps.app.goo.gl/9JjihTXLZddd1faz5' },
  { nombre: 'CAIF Anacahuita', dir: 'Las Lilas esq. Los Lirios', pos: [-34.8470974, -56.278704], color: '#e0457b', maps: 'https://maps.app.goo.gl/hyH49URMUeFX5cjn6' },
  { nombre: 'Club Baby Fútbol Naranja Mecánica', dir: 'Costanera Parque Tomkinson esq. Los Plátanos', pos: [-34.8450657, -56.2769587], color: '#14a3b8', maps: 'https://maps.app.goo.gl/Q7rrYxbWhkBgkE6F7' },
];
// Puntos de Eco Oficinas (tablero 'im'; edif coincide con vaciados_lugares).
const LUGARES_IM = [
  { nombre: 'Edificio IM', edif: 'Edificio IM', dir: 'Av. 18 de Julio 1360', pos: [-34.90651, -56.18609], color: '#1baf7a' },
];

// ── Árbol del menú: MUNICIPIO → BARRIO → PROGRAMA ───────────────────────────
// id = lo que va después del # en el link (programas.html#cerro). Para sumar uno, agregarlo acá y en PROGRAMAS.
const ARBOL = [
  { municipio: 'Municipio A', barrios: [
    { barrio: 'Cerro', programas: [
      { id: 'cerro', nombre: 'Barrios Sustentables', titulo: 'Barrios Sustentables: Cerro', ico: '♻',
        det: `${BARRIOS_CERRO.length} puntos` },
      { id: 'escuelas', nombre: 'Escuelas Sustentables', titulo: 'Escuelas Sustentables: Cerro', ico: '♻',
        det: `${ESCUELAS_CERRO.length} puntos` },
    ] },
    { barrio: '3 de Abril', programas: [
      { id: '3-de-abril', nombre: 'Barrios Sustentables', titulo: 'Barrios Sustentables: 3 de Abril', ico: '♻',
        det: `${LUGARES_3_DE_ABRIL.length} ${LUGARES_3_DE_ABRIL.length === 1 ? 'punto' : 'puntos'}` },
    ] },
    { barrio: 'Las Torres', programas: [
      { id: 'las-torres', nombre: 'Barrios Sustentables', titulo: 'Barrios Sustentables: Las Torres', ico: '♻',
        det: `${BARRIOS_LAS_TORRES.length} puntos` },
      { id: 'escuelas-las-torres', nombre: 'Escuelas Sustentables', titulo: 'Escuelas Sustentables: Las Torres', ico: '♻',
        det: `${ESCUELAS_LAS_TORRES.length} ${ESCUELAS_LAS_TORRES.length === 1 ? 'punto' : 'puntos'}` },
    ] },
  ] },
  { municipio: 'Municipio B', barrios: [
    { barrio: 'Centro', programas: [
      { id: 'im', nombre: 'Eco Oficinas', titulo: 'Eco Oficinas', ico: '♻',
        det: `${LUGARES_IM.length} ${LUGARES_IM.length === 1 ? 'punto' : 'puntos'}` },
    ] },
  ] },
];

// ── Utilidades ─────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const norm = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const urlMaps = l => l.maps ?? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(l.pos.join(','))}`;
const fmt = n => (n ?? 0).toLocaleString('es-UY', { maximumFractionDigits: 1 });
const pad = n => String(n).padStart(2, '0');
const fHora = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const fHoraCorta = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${String(d.getFullYear()).slice(2)} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const kpisHTML = G => [
  ['Bolsones vaciados', fmt(G.reduce((s, r) => s + r.cant, 0))],
  ['Solicitudes realizadas', fmt(G.length)],
].map(([l, n]) => `<div class="card kpi"><div class="kpi-l">${l}</div><div class="kpi-n num">${n}</div></div>`).join('');
const celdaFecha = d => `<td class="num"><span class="largo">${fHora(d)}</span><span class="corto">${fHoraCorta(d)}</span></td>`;
const KILOS_POR_BOLSON = 37;
const kilos = r => r.cant * KILOS_POR_BOLSON;
const celdaKilos = r => `<td class="num">${fmt(kilos(r))}</td>`;
const COLUMNAS_DETALLE = [
  ['Edificio'], ['Fecha de gestión', 'Fecha'], ['Cantidad bolsones', 'Bolsones'],
  ['Kilos'], ['Destino final', 'Destino'],
];
const cabecerasDetalle = COLUMNAS_DETALLE.map(([largo, corto]) => corto
  ? `<th><span class="largo">${largo}</span><span class="corto">${corto}</span></th>`
  : `<th>${largo}</th>`).join('');

function descargarDetalle(filas, titulo) {
  const datos = [COLUMNAS_DETALLE.map(([largo]) => largo), ...filas.map(r => [
    r.lugar.nombre, r.fGesD, r.cant, kilos(r), r.destino || '—',
  ])];
  const hoja = XLSX.utils.aoa_to_sheet(datos, { dateNF: 'dd/mm/yyyy hh:mm' });
  hoja['!cols'] = [38, 22, 20, 10, 22].map(wch => ({ wch }));
  const libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Detalle');
  const nombre = norm(titulo).replace(/[^a-z0-9]+/g, '-');
  XLSX.writeFile(libro, `detalle-${nombre}.xlsx`, { compression: true });
}
const VACIO = 'Todavía no hay solicitudes cargadas';
const celdaDestino = r => `<td>${r.destino ? esc(r.destino) : '—'}</td>`;

// ── Programas: cada uno lee sus datos y dibuja dentro de #contenido ─────────
let mapa = null;
const PROGRAMAS = {
  cerro: cont => puntosPrograma(cont, 'cerro', BARRIOS_CERRO),
  escuelas: cont => puntosPrograma(cont, 'cerro', ESCUELAS_CERRO),
  '3-de-abril': cont => puntosPrograma(cont, 'cerro', LUGARES_3_DE_ABRIL),
  'las-torres': cont => puntosPrograma(cont, 'cerro', BARRIOS_LAS_TORRES),
  'escuelas-las-torres': cont => puntosPrograma(cont, 'cerro', ESCUELAS_LAS_TORRES),
  im: cont => puntosPrograma(cont, 'im', LUGARES_IM),
};

// Mapa, fichas y tabla de los puntos del programa.
async function puntosPrograma(cont, tablero, lugares) {
    const porEdif = new Map(lugares.map(l => [norm(l.edif ?? l.nombre), l]));
    const G = (await leerVaciados(tablero))
      .map(f => ({ lugar: porEdif.get(norm(f.edif)), fGesD: f.fGes ? new Date(f.fGes) : null, cant: Number(f.cant), destino: f.destino }))
      .filter(r => r.lugar && r.fGesD && r.cant > 0).sort((a, b) => b.fGesD - a.fGesD);
    const por = lugares.map(l => {
      const g = G.filter(r => r.lugar === l);
      return { l, n: g.length, bolsones: g.reduce((s, r) => s + r.cant, 0), ultima: g[0]?.fGesD || null };
    });
    cont.innerHTML = `
      <section class="card mapa-card">
        <div class="card-h mapa-h"><div class="ley">${lugares.map(l => `<span class="lg" style="--c:${l.color}"><i></i>${esc(l.nombre)}</span>`).join('')}</div></div>
        <div id="mapa"></div>
      </section>
      <div class="kpis">${kpisHTML(G)}</div>
      <div class="puntos">${por.map(p => `<div class="card punto" style="--c:${p.l.color}">
        <h3>${esc(p.l.nombre)}</h3>
        <div class="dir"><a href="${esc(urlMaps(p.l))}" target="_blank" rel="noopener">${esc(p.l.dir)}</a></div>
        <dl><dt>Solicitudes realizadas</dt><dd class="num">${p.n}</dd>
        <dt>Bolsones vaciados</dt><dd class="num">${fmt(p.bolsones)}</dd>
        <dt>Última gestión</dt><dd class="num">${p.ultima ? fHora(p.ultima) : '—'}</dd></dl></div>`).join('')}</div>
      <section class="card detalle"><div class="tabla-wrap"><table class="tabla con-ed">
        <thead><tr>${cabecerasDetalle}</tr></thead>
        <tbody>${G.length ? G.map(r => `<tr>
          <td><span class="ed"><i class="pt" style="--c:${r.lugar.color}"></i>${esc(r.lugar.nombre)}</span></td>
          ${celdaFecha(r.fGesD)}<td class="num n">${fmt(r.cant)}</td>${celdaKilos(r)}${celdaDestino(r)}</tr>`).join('')
          : `<tr><td colspan="${COLUMNAS_DETALLE.length}" class="vacio">${VACIO}</td></tr>`}</tbody></table></div></section>
      <div class="exportar-detalle">
        <span class="excel-estado" role="status"></span>
        <button class="descargar-excel" type="button">Descargar Excel</button>
      </div>`;
    const estado = cont.querySelector('.excel-estado');
    cont.querySelector('.descargar-excel').addEventListener('click', () => {
      estado.textContent = '';
      try {
        descargarDetalle(G, $('infTitulo').textContent);
      } catch (error) {
        estado.textContent = 'No se pudo descargar el Excel.';
        console.error(error);
      }
    });
    return () => {
      // El mapa se arma cuando ya se ve (si no, Leaflet no sabe su tamaño). Sin zoom ni ventanitas.
      mapa = L.map('mapa', { zoomControl: false, attributionControl: false, zoomSnap: .25 });
      mapa.fitBounds(lugares.map(l => l.pos), { padding: [50, 50], maxZoom: 16.5, animate: false });
      L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`,
        { maxNativeZoom: 18, maxZoom: 20, subdomains: 'abcd' }).addTo(mapa);
      for (const l of lugares)
        L.circleMarker(l.pos, { radius: 11, color: '#fff', weight: 3, fillColor: l.color, fillOpacity: 1, interactive: false }).addTo(mapa);
    };
  }


// ── Menú en árbol ──────────────────────────────────────────────────────────
function dibujarArbol() {
  $('arbol').innerHTML = ARBOL.map(m => `<li>
    <div class="nodo munic"><div class="txt"><span class="eti">Municipio</span><span class="nom">${esc(m.municipio.replace(/^Municipio\s+/i, ''))}</span></div></div>
    <ul>${m.barrios.map(b => `<li>
      <div class="nodo barrio"><div class="txt"><span class="eti">Barrio</span><span class="nom">${esc(b.barrio)}</span></div></div>
      <ul><li class="rama-programas"><div class="nodo grupo-programas">
        <span class="eti">Programa</span>
        ${b.programas.map(p => `<a class="prog" href="#${p.id}">
          <div class="txt"><span class="nom">${esc(p.nombre)}</span><span class="det">${esc(p.det)}</span></div>
          <span class="ir" aria-hidden="true">›</span>
        </a>`).join('')}
      </div></li></ul></li>`).join('')}</ul></li>`).join('');
}

// ── Navegación con # (el botón Atrás del navegador vuelve al menú) ─────────
function buscar(id) {
  for (const m of ARBOL) for (const b of m.barrios) for (const p of b.programas)
    if (p.id === id) return p;
  return null;
}
let turno = 0;
async function mostrar() {
  const yo = ++turno;
  if (mapa) { mapa.remove(); mapa = null; }
  const p = buscar(location.hash.slice(1));
  if (!p) {
    document.title = 'Dashboard COM';
    $('informe').hidden = true; $('menu').hidden = false;
    return;
  }
  $('menu').hidden = true; $('informe').hidden = false;
  $('infTitulo').textContent = p.titulo;
  $('infIco').textContent = p.ico;
  $('contenido').hidden = true; $('contenido').innerHTML = '';
  $('pantallaCargando').hidden = false; $('ruedita').hidden = false; $('reintentar').hidden = true;
  $('cargaT').textContent = 'Cargando información'; $('cargaT').className = 'carga-t';
  window.scrollTo(0, 0);
  try {
    const despues = await PROGRAMAS[p.id]($('contenido'));
    if (yo !== turno) return;               // se cambió de pantalla mientras cargaba
    $('pantallaCargando').hidden = true; $('contenido').hidden = false;
    if (despues) despues();
  } catch (err) {
    if (yo !== turno) return;
    $('ruedita').hidden = true;
    $('cargaT').textContent = 'No se pudo leer la información (' + err.message + ')';
    $('cargaT').className = 'carga-t error';
    $('reintentar').hidden = false;
  }
}
$('reintentar').onclick = mostrar;
window.addEventListener('hashchange', mostrar);
dibujarArbol();
mostrar();
</script>
</body>
</html>
