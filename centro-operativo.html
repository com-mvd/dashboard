<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Centro Operativo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!--
  Centro Operativo — en qué está cada recurso planificado del turno.
  Fuentes (todas públicas, sin login):
    1. Planilla de seguimiento diario de transportistas (Google Sheets): quién está planificado, turno, si salió.
    2. Planilla TAREAS ESPECIALES (Google Sheets), pestaña del día "DD/MM": tareas en proceso / aceptadas / realizadas.
    3. Bases de Supabase (bucket público "bases"): reclamos, zona limpia, agenda y bolsones (asignados y cerrados hoy).
  Todas las horas se manejan como "reloj de Montevideo" (ms donde los campos UTC son la hora local).
-->
<style>
/* Colores de COM 2 (assets/comun.css y supervision-mapa.js), para que se vea igual que los otros mapas */
:root{
  --bg:#F7F6F3;--card:#FFFFFF;--ink:#1A1714;--mute:#5F5A54;--faint:#9A948C;--line:#E6E2DA;--soft:#EFEDE8;--mapa:#EFEDE8;
  --sin:#d03b3b;--marca:#eb6834;--pocas:#b7791f;--parado:#6250d6;--ok:#1baf7a;--esp:#2a78d6;--cierre:#827b71;--off:#9A948C;
  --rec:#2a78d6;--zl:#0e7490;--age:#6250d6;--bol:#a16207;
  --shadow:0 4px 20px rgba(26,23,20,.05),0 1px 3px rgba(26,23,20,.05);
}
:root[data-theme=dark]{
  --bg:#1e2126;--card:#272b31;--ink:#ECEAE6;--mute:#B3ADA5;--faint:#857F77;--line:#3b4048;--soft:#2e3238;--mapa:#2a2e34;
  --sin:#ff5252;--marca:#ff8a3d;--pocas:#ffcc33;--parado:#9d7dff;--ok:#2ee88f;--esp:#3d9bff;--cierre:#b8b1a7;--off:#857F77;
  --rec:#3d9bff;--zl:#1fd1f0;--age:#9d7dff;--bol:#ffcc33;
  --shadow:0 4px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1e2126;--card:#272b31;--ink:#ECEAE6;--mute:#B3ADA5;--faint:#857F77;--line:#3b4048;--soft:#2e3238;--mapa:#2a2e34;
  --sin:#ff5252;--marca:#ff8a3d;--pocas:#ffcc33;--parado:#9d7dff;--ok:#2ee88f;--esp:#3d9bff;--cierre:#b8b1a7;--off:#857F77;
  --rec:#3d9bff;--zl:#1fd1f0;--age:#9d7dff;--bol:#ffcc33;
  --shadow:0 4px 20px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "DM Sans",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ---------- barra ---------- */
.seg{display:inline-flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 13px;border-radius:7px;font-size:13px;color:var(--mute);font-weight:500}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.sp{flex:1}
.viejo{margin-top:6px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--marca)}
.viejo[hidden]{display:none}
.clock{position:absolute;top:12px;left:14px;z-index:500;pointer-events:none;text-shadow:0 0 6px var(--bg),0 0 12px var(--bg);font-size:40px;line-height:1;font-weight:600;letter-spacing:-.02em}


/* ---------- cuerpo ---------- */
.main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 440px;gap:12px;padding:16px 18px}
.mapbox{position:relative;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden;isolation:isolate;background:var(--soft)}
#map{position:relative;flex:1;min-height:0;background:var(--mapa)}
/* como en COM 2: siempre las teselas claras; en oscuro se invierten */
:root[data-theme=dark] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(1.08) contrast(.82)}
.mtools{position:absolute;bottom:10px;right:10px;z-index:500;display:flex;gap:4px}
.mtools button{height:26px;padding:0 8px;border-radius:7px;border:1px solid var(--line);background:color-mix(in srgb,var(--card) 90%,transparent);font-size:11.5px;color:var(--mute)}
.mtools button.ic{width:26px;padding:0;font-size:13px}
.mtools button:hover{color:var(--ink)}
.mtools button.on{color:var(--ink);border-color:var(--ink)}
/* Pantalla de carga como la de COM 2: ruedita azul y "Cargando información" al medio, tapa todo hasta que llegan todas las fuentes */
.loading{position:fixed;inset:0;z-index:2000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:0 16px;text-align:center;background:var(--bg)}
.loading[hidden]{display:none!important}
.rueda{width:38px;height:38px;border:3px solid #dbe3ed;border-top-color:#2563eb;border-radius:50%;animation:girar .8s linear infinite;flex:none}
.rueda[hidden]{display:none!important}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.rueda{animation-duration:2.4s}}
.carga-t{margin:0;color:#64748b;font-size:15px;font-weight:600;line-height:1.4;max-width:460px}
.carga-t.error{color:var(--sin)}
:root[data-theme=dark] .rueda{border-color:#3b4048;border-top-color:#7fa2dc}
:root[data-theme=dark] .carga-t{color:var(--mute)}

.side{display:flex;flex-direction:column;min-height:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.sh{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sh input{flex:1;min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:6px 10px;border-radius:8px;font:inherit;font-size:13px}
.list{flex:1;overflow:auto;scrollbar-width:none}
.list::-webkit-scrollbar,.ficha::-webkit-scrollbar{display:none}
.it{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--soft);cursor:pointer}
.it:hover{background:var(--soft)}
.it.sel{background:var(--soft)}
.it .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.it .st{font-size:12px;font-weight:650;color:var(--c);white-space:nowrap;text-align:right}
.it .d{grid-column:1/-1;font-size:11.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.empty{padding:22px;text-align:center;color:var(--mute);font-size:13px}

/* ficha */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px;border-bottom:1px solid var(--line)}
.k{border:1px solid var(--line);background:var(--soft);text-align:left;padding:7px 9px 6px;border-radius:10px;min-width:0}
.k.tot{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}
.k.tot .l{font-size:13px}
.k.tot .l small{display:inline;margin-left:8px}
.k:hover{border-color:var(--mute)}
.k.on{border-color:var(--c,var(--ink));box-shadow:inset 0 0 0 1px var(--c,var(--ink))}
.k .v{font-size:32px;font-weight:650;line-height:1.05;letter-spacing:-.03em;color:var(--c,var(--ink))}
.k .l{font-size:12px;color:var(--mute);line-height:1.2;margin-top:2px}
.k .l small{display:block;font-size:10.5px;color:var(--faint)}
.ficha{border-bottom:1px solid var(--line);padding:12px 14px;background:var(--soft);max-height:52%;overflow:auto}
.ficha h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.ficha h3 .x{margin-left:auto;border:0;background:transparent;font-size:16px;color:var(--mute)}
.badge{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:99px;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.kv{display:grid;grid-template-columns:108px 1fr;gap:3px 10px;font-size:12.5px;margin-top:8px}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
.svcs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-top:10px}
.sv{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:8px;padding:6px 9px;font-size:12px}
.sv b{display:block;font-size:11px;color:var(--sc);letter-spacing:.06em}

/* marcadores */
.pm-w{background:none;border:0}
.pm{width:100%;height:100%;border-radius:50%;background:var(--card);border:3px solid var(--pc);display:grid;place-items:center;font-size:14px;line-height:1;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 25%,transparent),0 2px 6px rgba(0,0,0,.35)}
.pm.alert{animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pc) 70%,transparent),0 2px 6px rgba(0,0,0,.35)}100%{box-shadow:0 0 0 14px transparent,0 2px 6px rgba(0,0,0,.35)}}
.leaflet-tooltip{font:12px "DM Sans",system-ui,sans-serif;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.leaflet-tooltip-top:before{border-top-color:var(--card)}
.pop .leaflet-popup-content-wrapper{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.4);padding:0}
.pop .leaflet-popup-content{margin:12px 14px;font:13px/1.4 "DM Sans",system-ui,sans-serif}
.pop .leaflet-popup-tip{background:var(--card);border:1px solid var(--line);box-shadow:none}
.pp-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pp-h b{font-size:15px;line-height:1.2}
.pp-h .badge{flex:none}
.pp-s{color:var(--faint);font-size:11.5px;margin-top:2px}
.pp dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:10px 0 0;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px}
.pp dt{color:var(--faint)}
.pp dd{margin:0;font-weight:600;text-align:right}
.pp-n{margin-top:8px;font-size:11px;color:var(--faint)}
.nl{box-sizing:border-box;font:600 11.5px/17px "DM Sans",system-ui,sans-serif;padding:0 7px;white-space:nowrap;color:var(--ink);background:color-mix(in srgb,var(--card) 88%,transparent);border:1px solid var(--line);border-radius:7px;text-align:center}
.leaflet-tooltip.lbl{padding:1px 7px;font-size:11.5px;font-weight:600;background:color-mix(in srgb,var(--card) 88%,transparent)}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-tooltip.mlbl{background:none;border:0;box-shadow:none;font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--mute);text-shadow:0 0 4px var(--bg),0 0 4px var(--bg)}
.leaflet-tooltip.mlbl:before{display:none}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-control-attribution{background:color-mix(in srgb,var(--bg) 70%,transparent)!important;color:var(--faint)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--mute)!important}

/* pantalla grande: un poco más de letra */
@media (min-width:1800px){body{font-size:15px}.k .v{font-size:40px}.main{grid-template-columns:1fr 500px}.clock{font-size:48px}}
@media (max-width:1100px){
  body{overflow:auto;display:block}
  .main{grid-template-columns:1fr;grid-template-rows:60vh auto}
  .side{max-height:none}.list{overflow:visible}
}
@media (max-width:560px){
  .main{padding-left:16px;padding-right:16px}
  .clock{font-size:26px}
}
</style>
</head>
<body>

<div class="loading" id="loading" role="status" aria-live="polite"><div class="rueda" id="rueda"></div><div class="carga-t" id="cargaT">Cargando información</div></div>
<main class="main">
  <div class="mapbox">
    <div id="map"></div>
    <div class="clock num" id="clock"><span id="hora">--:--</span><div class="viejo" id="viejo" hidden></div></div>
    <div class="mtools">
      <button class="ic" id="bTema" title="Tema claro / oscuro">◐</button>
      <button class="ic" id="bFs" title="Pantalla completa (F)">⛶</button>
    </div>
  </div>
  <aside class="side">
    <div class="kpis" id="kpis"></div>
    <div class="list" id="list"></div>
  </aside>
</main>

<script>
"use strict";
/* ============================== CONFIGURACIÓN ============================== */
const CFG={
  SB:'https://srgduwdvkgqrrmhxpzlx.supabase.co/storage/v1/object/public/bases/',
  PLAN:'1y1e4h2Tr0dLwxANuKqZWMMZLDCRzDtzkKqfZTRO8xEU',   // seguimiento diario de transportistas (primera pestaña)
  TE:'1MgxpmNHlQTaGs_w49SRTJrIo-CYWP2JPxjvx4AgSlAc',     // TAREAS ESPECIALES, pestaña del día "DD/MM"
  CARTO:'cb1_4dpf_1_b2ca9299be611862d5d23c88',           // clave pública del fondo de mapa (la misma de COM 2)
  ASIS:'1utiAj4kWcpwQijBYjiUX8pAIdTVqGdjSsit50EEhxhU',   // asistencia de empresas (pestaña "Asistencia"): de ahí sale qué unidades de ZL salen y su horario típico
  ASIS_PESTANA:'Asistencia',
  ASIS_DIAS:28,   // se miran las últimas 4 semanas
  GRACIA_ZL:30,   // el horario de las empresas es estimado: min de espera antes de avisar que no arrancó
  POCAS:2,        // con 1 o 2 tareas asignadas: "Pocas tareas"
  PARADO:60,      // min sin cerrar nada teniendo tareas: "Parado"
  CIERRE:45,      // últimos min del turno sin tareas: "Cierre de turno" (no es alerta)
  GRACIA:15,      // min después de la hora de entrada antes de avisar "Sin confirmar salida"
  MARGEN:30,      // "Ahora" muestra los turnos que empiezan o terminaron hace menos de esto (min)
  RITMO:90,       // ventana para medir cierres por hora (min)
  CO:'centro-operativo.json.gz',   // archivo liviano que arma n8n cada 5 min (flujo centroOperativo1): solo asignadas y cierres desde las 18 h de ayer
  VIEJO:15,       // min: si el archivo es más viejo, aviso debajo de la hora
  CADA_BASES:60, CADA_PLAN:120, CADA_TE:120, CADA_ASIS:1800   // segundos entre lecturas
};
const BASES={
  rec:{arch:'reclamos.json.gz',  clave:'reclamos',   nombre:'Reclamos',    corto:'R'},
  zl: {arch:'zona-limpia.json.gz',clave:'zona-limpia',nombre:'Zona Limpia', corto:'Z'},
  age:{arch:'agenda.json.gz',    clave:'agenda',     nombre:'Agenda',      corto:'A'},
  bol:{arch:'bolsones.json',     clave:'bolsones',   nombre:'Bolsones',    corto:'B'}
};
const KEYS=Object.keys(BASES);
/* Estados de un recurso planificado. o = orden en la lista; al = cuenta como alerta */
const ST={
  sin_tarea: {l:'Sin tarea',            c:'--sin',    o:0, al:1},
  sin_marca: {l:'Sin confirmar salida', c:'--marca',  o:1, al:1},
  parado:    {l:'Parado',               c:'--parado', o:2, al:1},
  pocas:     {l:'Pocas tareas',         c:'--pocas',  o:3, al:1},
  ok:        {l:'Trabajando',           c:'--ok',     o:4},
  especial:  {l:'Tarea especial',       c:'--esp',    o:5},
  te_espera: {l:'Tarea esp. por iniciar',c:'--esp',   o:6},
  cierre:    {l:'Cierre de turno',      c:'--cierre', o:7},
  por_entrar:{l:'Por entrar',           c:'--off',    o:8},
  no_salio:  {l:'No salió',             c:'--off',    o:9},
  retirado:  {l:'Se retiró',            c:'--off',    o:10},
  termino:   {l:'Terminó turno',        c:'--off',    o:11}
};
const TRABAJANDO=['sin_tarea','parado','pocas','ok','especial','te_espera','cierre'];
/* Nombres de las bases que no son un transportista (estados, zonas, derivaciones) */
const PSEUDO=[/^(limpio|repetido|playas|en proceso|derivado|pala|hecho|pendiente|cancelado)\s*-\s*\d+$/i,/^agenda\s*-/i,/^-$/,
  /^(capurro|cerro|la teja|malvin|bella italia|carrasco)\s*-\s*0\d\d$/i,/^regi[oó]n zona limpia/i];
const esPseudo=t=>!t||PSEUDO.some(r=>r.test(String(t).trim()));

/* ============================== UTILIDADES ============================== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const norm=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
/* Reloj de Montevideo: ms cuyos campos UTC son la hora local (igual que las fechas de las bases) */
const MVD=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Montevideo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function wall(ms){const p={};for(const x of MVD.formatToParts(new Date(ms)))p[x.type]=x.value;return Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second)}
const ahora=()=>wall(Date.now());
const DIA=86400000;
const diaDe=w=>Math.floor(w/DIA)*DIA;
const minDe=w=>Math.floor((w-diaDe(w))/60000);
const hhmm=w=>{const d=new Date(w);return pad(d.getUTCHours())+':'+pad(d.getUTCMinutes())};
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(Math.round(m)%60);
function dur(min){min=Math.max(0,Math.round(min));if(min<60)return min+' min';const h=Math.floor(min/60),m=min%60;return h+' h'+(m?' '+pad(m):'')}
function parseHM(x){const m=/(\d{1,2})\s*[:.]\s*(\d{2})/.exec(String(x||''));return m&&+m[1]<24?+m[1]*60+ +m[2]:null}
/* primer rango horario de un texto: "TURNO DE 7:00 A 14:00", "8 a 14Hs", "06:30 - 13:20" */
function parseRange(p){
  const m=/(?<![\d:])(\d{1,2})(?::(\d{2}))?\s*(?:hs?|hrs|horas)?\s*(?:a|-|–|hasta)\s*(\d{1,2})(?::(\d{2}))?(?!\d)/i.exec(p||'');
  if(!m)return null;
  const s=+m[1]*60+(+m[2]||0),e=+m[3]*60+(+m[4]||0);
  return (+m[1]<=23&&+m[3]<=24&&e>s)?[s,e]:null;
}
function parseCSV(t){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c;
  }
  if(f||row.length){row.push(f);rows.push(row)}
  return rows;
}

/* ---------- nombres: la planilla dice "Virginia Mora", la base "Virgina Mora -9998" ---------- */
const STOP=new Set(['y','e','de','del','la','las','los']);
const limpio=t=>String(t||'').replace(/\s*-\s*\d+\s*$/,'').replace(/\s*-\s*SA\s*$/i,'').trim();
function toks(s){return new Set(norm(limpio(s)).replace(/&/g,' ').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(x=>x&&!STOP.has(x)))}
function osa(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++){d[i]=[i];for(let j=1;j<=n;j++)d[i][j]=i?0:j}
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
    if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1);
  }
  return d[m][n];
}
function near(a,b){
  if(a===b)return true;
  const mn=Math.min(a.length,b.length),mx=Math.max(a.length,b.length);
  if(mn<4||mx-mn>2||/^\d+$/.test(a)||/^\d+$/.test(b))return false;
  return osa(a,b)<=(mx>=7?2:1);
}
/* Parecido entre dos nombres (0 = no son el mismo): todas las palabras del nombre más corto tienen que estar en el otro */
function parecido(A,B){
  const [S,L]=A.size<=B.size?[A,B]:[B,A];if(!S.size)return 0;
  let i=0;for(const x of S){for(const y of L)if(near(x,y)){i++;break}}
  if(i<S.size||(S.size===1&&[...S][0].length<4))return 0;
  return i/(A.size+B.size-i);
}

/* ============================== LECTURA: PLANILLAS ============================== */
async function hoja(id,sheet){
  const u=`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv&headers=0${sheet?'&sheet='+encodeURIComponent(sheet):''}&_=${Date.now()}`;
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok)throw new Error('HTTP '+r.status);
  const t=await r.text();
  if(/^\s*</.test(t))throw new Error('sin acceso (¿dejó de estar compartida?)');
  return parseCSV(t);
}
/* Planilla de seguimiento: Municipio | Transportista | Planificación | Tarea inicial | (enviada) | Sale? | Hora salida | Se retira | Observaciones */
function leerPlan(rows){
  const out=[];let turno='Matutino',grupo='';
  for(const r of rows){
    const c0=String(r[0]||'').trim(),c1=String(r[1]||'').trim(),n0=norm(c0);
    if(/turno\s+vespertino/.test(n0)){turno='Vespertino';grupo='';continue}
    if(/turno\s+matutino/.test(n0)){turno='Matutino';grupo='';continue}
    if(/turno\s+nocturno/.test(n0)){turno='Nocturno';grupo='';continue}
    if(/^seguimiento/.test(n0)||norm(c1)==='transportista')continue;
    if(c0)grupo=c0.replace(/\s+/g,' ');
    if(!c1||/^#n\/a$/i.test(c1))continue;
    const plan=String(r[2]||'').replace(/\s+/g,' ').trim();
    const rg=parseRange(plan)||(turno==='Vespertino'?[780,1200]:[420,840]);
    const sale=norm(r[5]);
    out.push({id:'p'+out.length,nombre:c1,tok:toks(c1),turno,grupo,plan,tarea:String(r[3]||'').trim(),s:rg[0],e:rg[1],
      sale:String(r[5]||'').trim(),noAsis:/no asisti/.test(sale),noCulmina:/no culmina/.test(sale),
      asis:!!sale&&!/no asisti/.test(sale),entra:parseHM(r[6]),retiro:parseHM(r[7]),obs:String(r[8]||'').trim()});
  }
  return out;
}
async function cargarPlan(){
  try{
    const p=leerPlan(await hoja(CFG.PLAN));
    if(!p.length)throw new Error('no se encontraron transportistas');
    DATA.plan=p;DATA.planAt=Date.now();DATA.planErr='';MATCH.clear();
  }catch(e){DATA.planErr='Planilla: '+e.message}
  pintar();
}
/* Tareas especiales: DIAS | TIPO | BLOQUE | MUNICIPIO | TAREA | MENSAJE | DETALLE | TRANSPORTISTA | ESTADO | HORA INICIO | HORA FINAL
   El transportista va combinado: las filas de abajo sin nombre son del mismo bloque. */
function leerTE(rows){
  const hi=rows.findIndex(r=>/^transportista/.test(norm(r[7]))&&/^estado/.test(norm(r[8])));
  if(hi<0)return null;
  const L=[];let cur='',curMun='';
  for(const r of rows.slice(hi+1)){
    if(/^(matutino|vespertino|nocturno)$/.test(norm(r[0]))){cur='';curMun='';continue}
    const t=String(r[7]||'').trim(),bloque=String(r[2]||'').trim(),mun=String(r[3]||'').trim();
    if(t)cur=t;else if(bloque)cur='';
    if(mun)curMun=mun;else if(bloque)curMun='';   // el 2º trabajador de un barrio viene sin municipio: es el del bloque
    r[3]=curMun;
    if(!cur)continue;
    const est=norm(r[8]);
    L.push({nombre:cur,tarea:String(r[4]||'').split('\n')[0].trim()||String(r[1]||'').trim(),mun:String(r[3]||'').trim(),
      est:/en proceso/.test(est)?'proc':/realizada/.test(est)?'real':/aceptada|envia/.test(est)?'acep':est?'otro':'plan',
      ini:parseHM(r[9]),fin:parseHM(r[10])});
  }
  return L;
}
/* Pestaña de acopios (si existe): TRANSPORTISTA en la col. 6, HORA INICIO y HORA FINAL en 7 y 8 */
function leerAcopios(rows){
  const hi=rows.findIndex(r=>/^transportista/.test(norm(r[5]))&&/^hora inicio/.test(norm(r[6])));
  if(hi<0)return [];
  return rows.slice(hi+1).filter(r=>String(r[5]||'').trim()&&/\d/.test(r[6]||'')).map(r=>({nombre:String(r[5]).trim(),tarea:'Acopio '+String(r[2]||'').split('|')[0].trim().slice(0,40),est:String(r[7]||'').trim()?'real':'proc',ini:parseHM(r[6]),fin:parseHM(r[7])}));
}
async function cargarTE(){
  const d=new Date(ahora()),dd=d.getUTCDate(),mm=d.getUTCMonth()+1;
  const tabs=[...new Set([`${pad(dd)}/${pad(mm)}`,`${dd}/${mm}`,`${dd}/${pad(mm)}`,`${pad(dd)}/${mm}`])];
  try{
    let L=null,tab='';
    for(const t of tabs){L=leerTE(await hoja(CFG.TE,t));if(L){tab=t;break}}  // si la pestaña no existe, Google devuelve la primera: se descarta
    if(!L)throw new Error('no hay pestaña «'+tabs[0]+'»');
    try{L=L.concat(leerAcopios(await hoja(CFG.TE,'Acopios '+tab)))}catch(e){}
    DATA.te=L.map(x=>({...x,tok:toks(x.nombre)}));DATA.teTab=tab;DATA.teAt=Date.now();DATA.teErr='';
  }catch(e){DATA.te=null;DATA.teErr='Tareas especiales: '+e.message}
  pintar();
}

/* ---------- Empresas de Zona Limpia: planilla de asistencia (se completa al día siguiente) ----------
   Pestaña "Asistencia": FECHA | TURNO | EMPRESA | ASISTENCIA | MATRÍCULA | HORA INICIO | HORA FIN | MOTIVO …
   Con las últimas 4 semanas se arma la lista de unidades que salen hoy (las que salieron algún día como hoy) y su horario típico. */
/* Nombre de la unidad, igual en la planilla y en las bases: "DG 1 ZONA LIMPIA - MATUTINO" y "DG1-050" -> DG1 */
function unidad(n){
  const x=norm(n).toUpperCase().replace(/\s*-\s*\d+\s*$/,'').trim();let m;
  if((m=/^DG\s*(\d+)/.exec(x)))return 'DG'+m[1];
  if((m=/^DINALI\s*(\d+)/.exec(x)))return 'DINALI'+m[1];
  if((m=/^ROSADO\s*(\d+)/.exec(x)))return 'ROSADO'+m[1];
  if((m=/^(?:SA|SALIR ADELANTE)\s*-?\s*B\s*(\d+)/.exec(x)))return 'SAB'+m[1];
  if((m=/^(?:VCV|VOS CON VOZ)\s*-?\s*B\s*(\d+)/.exec(x)))return 'VCVB'+m[1];
  if(/^(CAP|COM\s*-\s*FIDEICOMISO)\b/.test(x))return 'CAP';
  return '';
}
const EMPRESA={DG:'DG',DINALI:'DINALI',ROSADO:'ROSADO',SAB:'SALIR ADELANTE',VCVB:'VOS CON VOZ',CAP:'FIDEICOMISO'};
const titulo=s=>s.toLowerCase().replace(/(^|\s)(\p{L})/gu,(a,b,c)=>b+c.toUpperCase());
function nombreUnidad(u,n){
  const k=/^[A-Z]+/.exec(u)[0],num=u.slice(k.length);
  if(k==='DINALI'){const m=/^DINALI\s*\d+\s*(.*?)\s*(?:-\s*(?:MATUTINO|VESPERTINO|NOCTURNO))?\s*$/i.exec(String(n).trim());return 'DINALI '+num+(m&&m[1]?' · '+titulo(m[1]):'')}
  return {DG:'DG '+num,ROSADO:'Rosado '+num,SAB:'Salir Adelante B'+num,VCVB:'Vos con Voz B'+num,CAP:'CAP (fideicomiso)'}[k]||u;
}
const TURNO_DEF={Matutino:[360,660],Vespertino:[780,1080],Nocturno:[1260,1590]};
function leerAsis(rows){
  const W=ahora(),hoy=diaDe(W),lim=hoy-CFG.ASIS_DIAS*DIA,dow=new Date(W).getUTCDay();
  const g=new Map();
  for(const r of rows){
    const dm=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(String(r[0]||'').trim());if(!dm)continue;
    const d=Date.UTC(+dm[3],+dm[2]-1,+dm[1]);if(d<lim||d>=hoy)continue;
    const emp=String(r[2]||'').trim(),u=unidad(emp);if(!u)continue;
    const tn=norm(r[1]||emp),turno=/noct/.test(tn)?'Nocturno':/vesp/.test(tn)?'Vespertino':/mat/.test(tn)?'Matutino':'';if(!turno)continue;
    const id=u+'|'+turno;
    let o=g.get(id);if(!o){o={u,turno,emp,last:0,a:[],b:[],dias:new Set(),dows:new Map()};g.set(id,o)}
    if(d>=o.last){o.last=d;o.emp=emp}
    if(!/^(asisti|sale tarde|no culmina)/.test(norm(r[3])))continue;
    o.dias.add(d);const wd=new Date(d).getUTCDay();o.dows.set(wd,(o.dows.get(wd)||0)+1);
    let a=parseHM(r[5]),b=parseHM(r[6]);
    if(a!=null&&b!=null){if(turno==='Nocturno'&&a<720)a+=1440;if(b<a)b+=1440;o.a.push(a);o.b.push(b)}
  }
  const med=v=>{v=[...v].sort((x,y)=>x-y);return v[Math.floor(v.length/2)]};
  const out=[];
  for(const o of g.values()){
    if(o.u==='CAP')continue;   // CAP (fideicomiso) no se le asigna: solo reportan al terminar, así que no se controla
    if(o.dias.size<3||!o.dows.get(dow))continue;   // sale poco, o nunca un día como hoy (p. ej. fines de semana)
    const [s,e]=o.a.length>=3?[med(o.a),med(o.b)]:TURNO_DEF[o.turno];
    const k=/^[A-Z]+/.exec(o.u)[0],num=o.u.slice(k.length);
    out.push({id:'z:'+o.u+'|'+o.turno,zl:true,u:o.u,nombre:nombreUnidad(o.u,o.emp),corto:({SAB:'SA B',VCVB:'VCV B',DG:'DG ',DINALI:'DINALI ',ROSADO:'Rosado '}[k]||'')+num||'CAP',grupo:EMPRESA[/^[A-Z]+/.exec(o.u)[0]]||'',turno:o.turno,s,e,
      plan:`horario típico de las últimas ${CFG.ASIS_DIAS/7} semanas (${o.a.length} días con horas)`,dias:o.dias.size});
  }
  return out.sort((x,y)=>x.u.localeCompare(y.u,'es',{numeric:true}));
}
async function cargarAsis(){
  try{
    const z=leerAsis(await hoja(CFG.ASIS,CFG.ASIS_PESTANA));
    if(!z.length)throw new Error('no se encontraron unidades (¿cambió la pestaña «'+CFG.ASIS_PESTANA+'»?)');
    DATA.zl=z;DATA.zlAt=Date.now();DATA.zlErr='';MATCH.clear();
  }catch(e){DATA.zlErr='Asistencia empresas: '+e.message}
  pintar();
}

/* ============================== LECTURA: BASES DE SUPABASE ============================== */
async function bajar(arch,ver){
  // ?v=<hora de subida>: misma URL mientras no cambie, así el navegador puede reusar lo que ya bajó
  const r=await fetch(CFG.SB+arch+'?v='+encodeURIComponent(ver||Date.now()));
  if(!r.ok)throw new Error('HTTP '+r.status+' en '+arch);
  const b=new Uint8Array(await r.arrayBuffer());
  const t=(b[0]===0x1f&&b[1]===0x8b)?await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text():new TextDecoder().decode(b);
  return JSON.parse(t);
}
let revisando=false;
/* Bases: un solo archivo chico (~60 KB) que arma n8n cada 5 min pidiéndole al Grafana solo lo que usa el mapa.
   Antes se bajaban las 4 bases enteras de Supabase (~16,7 MB en cada actualización). */
async function cargarBases(){
  if(revisando)return;revisando=true;
  try{
    const d=await bajar(CFG.CO,Date.now());
    if(!d||!d.bases)throw new Error('formato desconocido en '+CFG.CO);
    const at=wall(Date.parse(d.generado)),hoy=diaDe(ahora()),corte=hoy-6*3600000;   // cierres desde las 18 h de ayer
    for(const k of KEYS){
      const b=d.bases[k];
      if(!b||b.err){DATA['err_'+k]=b?b.err:'no viene en el archivo';continue}   // se queda con lo último que tenía
      const done=b.done.filter(x=>x.f>=corte);let max=0;for(const x of done)if(x.f>max)max=x.f;
      DATA.bases[k]={pend:b.pend,done,max,filas:b.pend.length+b.done.length,at:Math.max(at,max),subida:at,hoy};
      delete DATA['err_'+k];
    }
    DATA.generado=at;DATA.basesErr='';DATA.basesAt=Date.now();
  }catch(e){DATA.basesErr='Supabase: '+e.message}
  finally{revisando=false;pintar()}
}

/* ============================== MODELO ============================== */
const MATCH=new Map(); // nombre en la base -> [ids de la planilla]
function emparejar(t){
  if(MATCH.has(t))return MATCH.get(t);
  // primero las unidades de las empresas de ZL (DG1, DINALI 4, ROSADO 2…): una por turno
  const u=unidad(t);let ids=u?(DATA.zl||[]).filter(z=>z.u===u).map(z=>z.id):[];
  if(!ids.length){
    const T=toks(t);let best=0;
    for(const p of DATA.plan||[]){const s=parecido(T,p.tok);if(s>best){best=s;ids=[p.id]}else if(s&&s===best)ids.push(p.id)}
  }
  MATCH.set(t,ids);return ids;
}
const TEM=new Map();
function teDe(p){
  if(!DATA.te)return null;
  const key=p.id+'|'+DATA.teAt;if(TEM.has(key))return TEM.get(key);
  let r=null;
  for(const x of DATA.te){
    if(!parecido(p.tok,x.tok))continue;
    if(!r)r={proc:null,pend:0,real:0,lastFin:null,firstIni:null,items:[]};
    r.items.push(x);
    if(x.est==='proc'&&!r.proc)r.proc=x;
    else if(x.est==='acep'||x.est==='plan')r.pend++;
    else if(x.est==='real'){r.real++;if(x.fin!=null&&(r.lastFin==null||x.fin>r.lastFin))r.lastFin=x.fin}
    if(x.ini!=null&&(r.firstIni==null||x.ini<r.firstIni))r.firstIni=x.ini;
  }
  TEM.set(key,r);return r;
}
function tipoDe(p){
  if(p.zl)return /^DINALI/.test(p.u)?['🛵','Motocarro de Zona Limpia']:['🚛','Camión de Zona Limpia'];
  if(p.per.bol)return ['🚛','Camión de bolsones'];
  if(p.per.age||/voluminoso/i.test(p.nombre))return ['🚛','Agenda / voluminosos'];
  return ['🛵','Motocarro'];
}
/* Turno de hoy en ms (reloj de Montevideo). Un nocturno que cruza la medianoche, de madrugada, es el que empezó ayer. */
function ventana(p,W){
  const hoy=diaDe(W),m=minDe(W);
  const base=p.e>1440&&m<p.e-1440+CFG.MARGEN?hoy-DIA:hoy;
  p.S=base+p.s*60000;p.E=base+p.e*60000;
}
/* Si un mismo nombre de la base corresponde a varios turnos (DG1 hace matutino, vespertino y nocturno), cada tarea va al turno más cercano a su hora */
const distV=(p,t)=>t<p.S?p.S-t:t>p.E?t-p.E:0;
function elegir(cands,t){let b=cands[0],bd=Infinity;for(const p of cands){const d=distV(p,t);if(d<bd){bd=d;b=p}}return b}
function armar(){
  const W=ahora(),hoy=diaDe(W),m=minDe(W);
  const nuevo=p=>({...p,pend:[],done:[],per:{},base:new Set()});
  const P=(DATA.plan||[]).map(nuevo).concat((DATA.zl||[]).map(nuevo));
  for(const p of P)ventana(p,W);
  const byId=new Map(P.map(p=>[p.id,p]));
  const fuera=new Map();
  const reg=(p,k,it,tipo)=>{p[tipo].push(it);p.base.add(it.t);(p.per[k]||(p.per[k]={pend:0,done:0,last:0}))[tipo]++;if(tipo==='done'&&it.f>p.per[k].last)p.per[k].last=it.f};
  for(const k of KEYS){
    const b=DATA.bases[k];if(!b)continue;
    const add=(it,tipo)=>{
      if(esPseudo(it.t)||unidad(it.t)==='CAP')return;   // CAP no se controla
      const cands=emparejar(it.t).map(i=>byId.get(i)).filter(Boolean);
      if(!cands.length){
        if(tipo==='done'&&it.f<hoy)return;   // de ayer a la noche: solo cuenta para un turno nocturno
        let f=fuera.get(it.t);
        if(!f){f={id:'f:'+it.t,nombre:limpio(it.t),fuera:true,pend:[],done:[],per:{},base:new Set()};fuera.set(it.t,f)}
        reg(f,k,it,tipo);return;
      }
      const t=tipo==='done'?it.f:W,p=elegir(cands,t);
      if(tipo==='done'&&distV(p,t)>60*60000)return;   // cierre fuera de su turno (p. ej. de ayer)
      reg(p,k,it,tipo);
    };
    for(const it of b.pend)add(it,'pend');
    for(const it of b.done)add(it,'done');
  }
  for(const p of P)juzgar(p,W,hoy,m);
  for(const f of fuera.values())posicion(f);
  // Sin nada con coordenadas en las bases (bloques, barrios, recién salidos): al centro de su municipio, repartidos en un círculo
  const porMun={};
  for(const p of P){
    if(p.pos)continue;
    const mun=munDe(p);if(!mun)continue;
    (porMun[mun]||(porMun[mun]=[])).push(p);
  }
  for(const mun in porMun){
    const c=centroMun(mun),arr=porMun[mun];
    arr.forEach((p,i)=>{const a=i/arr.length*2*Math.PI,r=arr.length>1?.007:0;p.pos=[c[0]+r*Math.sin(a),c[1]+r*1.2*Math.cos(a)];p.approx='mun';p.mun=mun});
  }
  return {P,fuera:[...fuera.values()],W,m};
}
const munKey=s=>{const x=String(s||'').toUpperCase().trim();if(MUNI_GEO&&MUNI_GEO[x])return x;const m=/^(CH|[A-G])\b/.exec(x);return m&&MUNI_GEO&&MUNI_GEO[m[1]]?m[1]:''};
function munDe(p){
  // Primero dónde anda según Tareas especiales: la que está haciendo, si no la última que terminó, si no la próxima.
  if(p.te){
    const it=p.te.items,km=x=>x&&munKey(x.mun);
    const proc=it.find(x=>x.est==='proc'&&km(x));if(proc)return km(proc);
    const real=it.filter(x=>x.est==='real'&&km(x)).sort((a,b)=>(b.fin??b.ini??0)-(a.fin??a.ini??0))[0];if(real)return km(real);
    const sig=it.find(x=>km(x));if(sig)return km(sig);
  }
  const g=munKey(p.grupo);if(g)return g;
  for(const x of p.pend)if(munKey(x.mun))return munKey(x.mun);
  return '';
}
const CMUN={};
function centroMun(id){
  if(CMUN[id])return CMUN[id];
  let best=null;for(const pol of MUNI_GEO[id])if(!best||pol[0].length>best.length)best=pol[0];
  let la=0,ln=0;for(const [x,y] of best){la+=y;ln+=x}
  return CMUN[id]=[la/best.length,ln/best.length];
}
function posicion(p){
  let last=null;for(const d of p.done)if(d.la&&(!last||d.f>last.f))last=d;
  if(last){p.pos=[last.la,last.ln];p.lastF=last.f;p.approx=false;return}
  let n=0,la=0,ln=0;for(const x of p.pend)if(x.la){la+=x.la;ln+=x.ln;n++}
  p.pos=n?[la/n,ln/n]:null;p.approx=!!n;
}
/* Agenda/voluminosos y bolsones: no tienen "poca tarea" (o tienen tarea o no) */
const esAgBol=p=>!p.zl&&(p.per.bol||p.per.age||/voluminoso/i.test(p.nombre));
function juzgar(p,W,hoy,m){
  posicion(p);
  const te=p.te=p.zl?null:teDe(p);
  // hora de "ahora" para este recurso: la de la base más atrasada en la que tiene tareas (no se le cuenta como parado el atraso de la base)
  let ref=W;for(const k in p.per){const b=DATA.bases[k];if(b)ref=Math.min(ref,b.at)}
  p.ref=ref;
  const lastDone=p.done.reduce((x,d)=>Math.max(x,d.f),0);
  const cand=[];
  if(lastDone)cand.push((ref-lastDone)/60000);
  if(te){if(te.proc&&te.proc.ini!=null)cand.push(m-te.proc.ini);if(te.lastFin!=null)cand.push(m-te.lastFin)}
  if(p.entra!=null&&p.entra<=m)cand.push(m-p.entra);
  p.idle=cand.length?Math.max(0,Math.min(...cand)):null;
  p.lastDone=lastDone;
  const nW=p.done.filter(d=>d.f>=ref-CFG.RITMO*60000).length;
  p.rate=nW>=3?nW/(CFG.RITMO/60):0;
  const hizoAlgo=p.done.length>0||!!(te&&(te.proc||te.real));
  const salio=p.asis||hizoAlgo;
  p.salio=salio;
  const n=p.pend.length,min=x=>x/60000;
  const gracia=p.zl?CFG.GRACIA_ZL:CFG.GRACIA;   // el horario de las empresas es estimado: se espera un poco más
  const cerrando=p.zl&&p.idle!=null&&p.idle<=CFG.PARADO;
  let st;
  // La planilla manda: si dice "No asistió" no salió, aunque en Tareas especiales figure algo (se avisa en la ficha)
  p.contradice=p.noAsis&&hizoAlgo;
  if(p.noAsis)st='no_salio';
  else if(p.retiro!=null||p.noCulmina)st='retirado';
  else if(W>p.E&&!cerrando)st='termino';   // una empresa que sigue cerrando después de su hora típica sigue en calle
  else if(!salio)st=W>=p.S+gracia*60000?'sin_marca':'por_entrar';
  else if(te&&te.proc)st='especial';
  else if(n===0){
    if(te&&te.pend)st=te.lastFin!=null&&m-te.lastFin>CFG.PARADO?'parado':'te_espera';   // tiene tareas especiales por hacer: si hace rato que no arranca ninguna, está parado
    else if(cerrando)st='ok';   // las empresas de ZL cierran contenedores sin tenerlos asignados: si vienen cerrando, trabajan
    else st=min(p.E-W)<=CFG.CIERRE?'cierre':'sin_tarea';
  }
  else if(p.idle!=null&&p.idle>CFG.PARADO&&min(W-p.S)>CFG.PARADO)st='parado';
  else if(n<=CFG.POCAS&&!cerrando&&!esAgBol(p))st='pocas';   // agenda y bolsones: con 1 o más ya están con tarea
  else st='ok';
  p.st=st;
}
/* Qué recursos se miran: los que deberían estar trabajando ahora (dentro de su horario) y los que siguen en calle pasada su hora */
function enVista(p,W){
  return (W>=p.S&&W<=p.E)||TRABAJANDO.includes(p.st);
}
function detalle(p){
  const S=p.st,est=p.zl?'~':'';
  if(S==='no_salio')return (p.contradice?'⚠ pero figura con tareas hoy · ':'')+(p.obs||'—');
  if(S==='retirado')return (p.retiro!=null?'a las '+hm(p.retiro):'')+(p.obs?' · '+p.obs:'');
  if(S==='termino')return 'turno '+est+hm(p.s)+'–'+est+hm(p.e);
  if(S==='por_entrar')return 'entra '+est+hm(p.s);
  if(S==='sin_marca')return p.zl?'suele salir '+hm(p.s)+' · sin cierres todavía':'debía entrar '+hm(p.s)+' · nada en la planilla';
  if(S==='especial')return p.te.proc.tarea+(p.te.proc.ini!=null?' · desde '+hm(p.te.proc.ini):'');
  if(S==='te_espera')return (p.te.items.find(x=>x.est==='acep'||x.est==='plan')||{}).tarea||'';
  if(S==='sin_tarea')return p.idle!=null?'sin tareas · últ. actividad hace '+dur(p.idle):'sin tareas asignadas';
  if(S==='parado')return p.pend.length?'hace '+dur(p.idle)+' sin cerrar · '+p.pend.length+' asignadas':'hace '+dur(p.idle)+' sin actividad · '+p.te.pend+' tarea'+(p.te.pend===1?'':'s')+' especial'+(p.te.pend===1?'':'es')+' por hacer';
  if(S==='cierre')return 'termina '+est+hm(p.e);
  return (p.lastDone?'último cierre '+hhmm(p.lastDone):'sin cierres aún')+(p.rate?' · '+Math.round(p.rate)+'/h':'');
}
const corto=n=>{const w=String(n).split(/\s+/);return w.length>2&&!/\by\b|&/i.test(n)?w[0]+' '+w[w.length-1]:n};

/* ============================== PINTAR ============================== */
let MODEL=null,pend=false;
// setTimeout y no requestAnimationFrame: este último se frena con la pestaña en segundo plano
function pintar(){if(pend)return;pend=true;setTimeout(()=>{pend=false;try{render()}catch(e){console.error(e)}},30)}
function render(){
  barra();
  if(!ARRANCO)return;   // hasta que llegan todas las fuentes solo se ve "Cargando información"
  if(!DATA.plan){carga(DATA.planErr||'No se pudo leer la planilla de transportistas');return}
  $('loading').hidden=true;
  MODEL=armar();
  const vis=MODEL.P.filter(p=>enVista(p,MODEL.W));
  kpis(vis);
  lista(vis);
  mapa(vis);
}
function barra(){
  const W=ahora(),d=new Date(W);
  const dias=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],mes=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  $('hora').textContent=hhmm(W);
  // Aviso discreto debajo de la hora si el archivo de n8n no se actualiza (PC, VPN o n8n caídos)
  const g=DATA.generado,v=$('viejo'),viejo=ARRANCO&&(g?W-g>CFG.VIEJO*60000:!!DATA.basesErr);
  v.hidden=!viejo;
  if(viejo)v.textContent=g?'datos de hace '+dur((W-g)/60000):'sin datos de las bases';
}
/* Indicadores: los que deberían estar trabajando ahora, cada uno en un solo grupo, así que la suma da el total. */
function grupoK(p){
  const s=p.st;
  if(s==='no_salio'||s==='retirado')return 'inasis';   // "No asistió" o se retiró antes ("No culmina la jornada")
  if(s==='sin_marca'||s==='por_entrar')return 'sinconf'; // pasó su hora de entrada sin marca en la planilla ni actividad
  if(['ok','especial','te_espera','cierre'].includes(s))return 'con';
  return s;   // pocas, sin_tarea, parado
}
function kpis(vis){
  const c=g=>vis.filter(p=>grupoK(p)===g).length,nSin=c('sin_tarea');
  const k=(id,l,n,col,cls='')=>`<button class="k ${cls} ${UI.filtro===id?'on':''}" data-f="${id}" style="${col?'--c:var('+col+')':''}"><div class="v num">${n}</div><div class="l">${l}</div></button>`;
  $('kpis').innerHTML=
    k('todos','Deberían estar trabajando ahora',vis.length,'','tot')+
    k('con','Con tarea',c('con'),'--ok')+k('inasis','Inasistencia',c('inasis'),'--mute')+k('sinconf','Sin confirmar',c('sinconf'),'--marca')+
    k('parado','Parados',c('parado'),'--parado')+k('pocas','Poca tarea',c('pocas'),'--pocas')+k('sin_tarea','Sin tarea',nSin,'--sin');
  $('kpis').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{UI.filtro=UI.filtro===b.dataset.f||b.dataset.f==='todos'?null:b.dataset.f;UI.sel=null;render()});
}
const FILTROS={};for(const g of ['con','inasis','sinconf','parado','pocas','sin_tarea'])FILTROS[g]=p=>grupoK(p)===g;
const filtrados=vis=>{const q=norm(UI.q);return vis.filter(p=>(!UI.filtro||FILTROS[UI.filtro](p))&&(!q||norm(p.nombre).includes(q)||norm(p.grupo).includes(q)))};
function chipsSvc(p){const ks=KEYS.filter(k=>p.per[k]);return ks.length?'<span class="chs">'+ks.map(k=>`<i style="--sc:var(--${k})" title="${BASES[k].nombre}">${BASES[k].corto}</i>`).join('')+'</span>':''}
function fila(p){
  const s=ST[p.st]||{l:'Con actividad',c:'--off'};
  return `<div class="it" data-id="${esc(p.id)}" style="--c:var(${s.c})">
    <div class="n">${esc(p.nombre)}</div><div class="st">${s.l}</div>
    <div class="d">${esc(p.fuera?(p.done.length?'último cierre '+hhmm(Math.max(...p.done.map(d=>d.f))):'sin cierres hoy'):detalle(p))}</div></div>`;
}
/* Debajo de los indicadores: solo los que necesitan atención (o, si se tocó un indicador, los de ese grupo), en una lista simple */
function lista(vis){
  const ord=(a,b)=>ST[a.st].o-ST[b.st].o||(b.idle??-1)-(a.idle??-1)||a.nombre.localeCompare(b.nombre);
  const arr=filtrados(vis).filter(p=>UI.filtro||ST[p.st].al).sort(ord);
  const box=$('list'),sc=box.scrollTop;
  box.innerHTML=arr.length?arr.map(fila).join(''):`<div class="empty">${UI.filtro?'No hay recursos en este grupo.':'✓ Todos los que deberían estar trabajando tienen tarea.'}</div>`;
  box.scrollTop=sc;
  box.querySelectorAll('[data-id]').forEach(r=>r.onclick=()=>{const m=MK.get(r.dataset.id);if(!m)return;if(POP===r.dataset.id){m.closePopup();return}MAP.panTo(m.getLatLng());m.openPopup()});
  marcarFila();
}
const buscar=id=>MODEL&&(MODEL.P.find(p=>p.id===id)||MODEL.fuera.find(f=>f.id===id));
function ficha(){
  const el=$('ficha'),p=UI.sel&&buscar(UI.sel);
  if(!p){el.hidden=true;return}
  el.hidden=false;
  const s=ST[p.st]||{l:'Fuera de planilla',c:'--off'};
  const te=p.te;
  const rows=[];
  if(p.zl){
    rows.push(['Turno',`${p.turno} · ~${hm(p.s)} a ~${hm(p.e)}`]);
    rows.push(['Empresa',p.grupo]);
    rows.push(['Horario',`estimado: ${p.plan}; salió ${p.dias} días en las últimas ${CFG.ASIS_DIAS/7} semanas`]);
    rows.push(['Hoy','La asistencia de las empresas se carga al día siguiente: hoy se ve por los cierres en las bases']);
  }else if(!p.fuera){
    rows.push(['Turno',`${p.turno} · ${hm(p.s)} a ${hm(p.e)}`]);
    rows.push(['Grupo',p.grupo||'—']);
    rows.push(['Tarea inicial',p.tarea||'—']);
    rows.push(['Planilla',(p.sale||'sin marcar')+(p.entra!=null?' · salió '+hm(p.entra):'')+(p.retiro!=null?' · se retira '+hm(p.retiro):'')]);
    if(p.obs)rows.push(['Observaciones',p.obs]);
    if(p.contradice)rows.push(['⚠ Revisar','La planilla dice «No asistió» pero tiene tareas especiales o cierres hoy']);
    if(te){
      rows.push(['Tarea especial',te.proc?`<b>En proceso:</b> ${esc(te.proc.tarea)}${te.proc.ini!=null?' · desde '+hm(te.proc.ini):''}`:'Ninguna en proceso']);
      rows.push(['',`${te.real} realizada${te.real===1?'':'s'}${te.lastFin!=null?' (última '+hm(te.lastFin)+')':''} · ${te.pend} por hacer`]);
    }else rows.push(['Tarea especial',DATA.te?'No figura en la pestaña del día':'—']);
  }
  rows.push(['En las bases',p.base.size?[...p.base].map(esc).join(', '):'No aparece hoy']);
  if(p.idle!=null&&!p.fuera)rows.push(['Última actividad','hace '+dur(p.idle)]);
  const svcs=KEYS.filter(k=>p.per[k]).map(k=>`<div class="sv" style="--sc:var(--${k})"><b>${BASES[k].nombre.toUpperCase()}</b>${p.per[k].pend} asignadas · ${p.per[k].done} cerradas${p.per[k].last?'<br>último cierre '+hhmm(p.per[k].last):''}</div>`).join('');
  el.innerHTML=`<h3>${tipoDe(p)[0]} ${esc(p.nombre)} <span class="badge" style="--c:var(${s.c})">${s.l}</span><button class="x" title="Cerrar">✕</button></h3>
    <dl class="kv">${rows.map(([a,b])=>`<dt>${a}</dt><dd>${a==='Tarea especial'||a==='En las bases'?b:esc(b)}</dd>`).join('')}</dl>${svcs?`<div class="svcs">${svcs}</div>`:''}`;
  el.querySelector('.x').onclick=()=>{UI.sel=null;fitKey='';render()};
}

/* ============================== MAPA ============================== */
let MAP=null,TILE=null,TILEDARK=null,LAY=null,MUNL=null,fitKey='';
const isDark=()=>{const t=document.documentElement.dataset.theme;return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches};
const cv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function mapa(vis){
  if(!window.L){$('map').innerHTML='<div class="empty">No se pudo cargar el mapa (falta conexión a internet).</div>';return}
  if(!MAP){
    MAP=L.map('map',{zoomControl:false,attributionControl:false,preferCanvas:true,maxZoom:18}).setView([-34.86,-56.17],12);
    MAP.createPane('muni').style.zIndex=350;
    MAP.createPane('etq').style.zIndex=650;MAP.getPane('etq').style.pointerEvents='none';
    MUNL=L.layerGroup().addTo(MAP);LAY=L.layerGroup().addTo(MAP);
    let zt;MAP.on('moveend',()=>{clearTimeout(zt);zt=setTimeout(render,120)});
    let rt;new ResizeObserver(()=>{MAP.invalidateSize();clearTimeout(rt);rt=setTimeout(()=>{fitKey='';render()},250)}).observe($('map'));
  }
  const dark=isDark();
  if(TILEDARK!==dark){
    if(TILE)MAP.removeLayer(TILE);
    TILE=L.tileLayer(`https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=${CFG.CARTO}`,{subdomains:'abcd',maxZoom:19,attribution:'© OpenStreetMap · © CARTO'}).addTo(MAP);
    TILEDARK=dark;
  }
  // municipios
  MUNL.clearLayers();
  if(UI.mun&&MUNI_GEO)for(const id in MUNI_GEO){
    L.polygon(MUNI_GEO[id].map(p=>p.map(r=>r.map(([x,y])=>[y,x]))),{pane:'muni',interactive:false,color:cv('--mute'),weight:2.2,opacity:.9,fill:true,fillColor:cv('--mute'),fillOpacity:.04}).addTo(MUNL);
  }
  PINTANDO=true;MK.clear();LAY.clearLayers();
  const L2=filtrados(vis).filter(p=>p.pos&&TRABAJANDO.includes(p.st));
  const sel=UI.sel&&buscar(UI.sel);
  const pts=[],selPts=[];
  // recorrido del seleccionado: cerrado hoy (verde, numerado por orden) y asignado (azul)
  if(sel){
    const ok=cv('--ok'),blu=cv('--rec'),card=cv('--card');
    [...sel.done].filter(d=>d.la).sort((a,b)=>a.f-b.f).forEach((d,i)=>{
      L.circleMarker([d.la,d.ln],{radius:6,color:card,weight:1.5,fillColor:ok,fillOpacity:.95}).bindTooltip(`<b>✔ ${i+1} · cerrado ${hhmm(d.f)}</b> · ${BASES[d.k].nombre}<br>${esc(d.inc)}${d.cont?' · cont. '+esc(d.cont):''}<br>${esc(d.dir.split(',')[0])}`,{direction:'top'}).addTo(LAY);
      selPts.push([d.la,d.ln]);
    });
    for(const x of sel.pend)if(x.la){
      L.circleMarker([x.la,x.ln],{radius:6,color:blu,weight:2.5,fillColor:card,fillOpacity:1}).bindTooltip(`<b>◔ Asignado</b> · ${BASES[x.k].nombre}<br>${esc(x.inc)}${x.cont?' · cont. '+esc(x.cont):''}<br>${esc(x.dir.split(',')[0])}`,{direction:'top'}).addTo(LAY);
      selPts.push([x.la,x.ln]);
    }
  }
  const lbls=[],obst=[];
  const marker=(p,col,alert,op)=>{
    const s=UI.sel===p.id,sz=s?40:(p.fuera?22:30),ic=tipoDe(p)[0];
    const m=L.marker(p.pos,{icon:L.divIcon({className:'pm-w',html:`<div class="pm${p.approx?' ap':''}${alert?' alert':''}" style="--pc:${col};opacity:${op};font-size:${p.fuera?11:s?18:14}px"><span>${ic}</span></div>`,iconSize:[sz,sz],iconAnchor:[sz/2,sz/2]}),keyboard:false,zIndexOffset:s?2000:alert?1000:0});
    m.bindPopup(()=>popHtml(p),{className:'pop',closeButton:false,maxWidth:320,minWidth:230,offset:[0,-sz/2+6],autoPanPadding:[24,24]});
    m.on('popupopen',()=>{POP=p.id;marcarFila()});m.on('popupclose',()=>{if(!PINTANDO){POP=null;marcarFila()}});
    MK.set(p.id,m);
    obst.push({pos:p.pos,sz});
    if(!p.fuera&&['pocas','sin_tarea','parado'].includes(p.st)||UI.sel===p.id)lbls.push({p,sz,txt:p.corto||corto(p.nombre)});   // nombre solo a los que necesitan atención (y al seleccionado)
    m.addTo(LAY);pts.push(p.pos);if(s)selPts.push(p.pos);
  };
  if(UI.fuera&&!UI.filtro)for(const f of MODEL.fuera)if(f.pos)marker(f,cv('--off'),false,sel&&sel!==f?.3:.85);
  for(const p of L2)marker(p,cv(grupoK(p)==='con'?'--ok':ST[p.st].c),   // en el mapa solo 4 colores: con tarea (verde), poca (amarillo), parado (violeta), sin tarea (rojo)
    ['sin_tarea','pocas','parado'].includes(p.st),sel&&sel!==p?.35:1);
  const key=UI.sel+'|'+UI.filtro+'|'+pts.length;   // vuelve a encuadrar cuando cambia cuántos hay en el mapa (llega una fuente, alguien sale o termina)
  if(key!==fitKey&&(selPts.length||pts.length)){
    fitKey=key;
    MAP.fitBounds(L.latLngBounds(selPts.length?selPts:pts),{padding:[50,50],maxZoom:selPts.length>1?16:selPts.length?14:13});
  }
  etiquetas(lbls,obst);
  if(POP&&MK.has(POP))MK.get(POP).openPopup();
  PINTANDO=false;
}

/* Nombres de todos los recursos, a cualquier zoom, sin encimarse: cada etiqueta busca el primer lugar libre alrededor de su marcador
   (derecha, izquierda, arriba, abajo, diagonales, cada vez más lejos). Si quedó lejos, una rayita la une al marcador. */
let CTX=null;
/* Etiqueta al hacer clic en un recurso: solo lo útil */
let POP=null,PINTANDO=false;const MK=new Map();
function marcarFila(){document.querySelectorAll('#list .it').forEach(r=>r.classList.toggle('sel',r.dataset.id===POP))}
function popHtml(p){
  const st=ST[p.st]||{l:'Fuera de planilla',c:'--off'};
  const col=p.fuera?'--off':grupoK(p)==='con'?'--ok':st.c,est=p.zl?'~':'';
  const fil=[];
  if(!p.fuera)fil.push(['Horario',est+hm(p.s)+' – '+est+hm(p.e)]);
  fil.push(['Asignadas',p.pend.length]);
  const ult=p.done.reduce((x,d)=>Math.max(x,d.f),0);
  fil.push(['Cerradas hoy',p.done.length+(ult?' · última '+hhmm(ult):'')]);
  if(['parado','sin_tarea'].includes(p.st)&&p.idle!=null)fil.push(['Sin actividad hace',dur(p.idle)]);
  if(p.te&&(p.te.proc||p.te.real||p.te.pend))fil.push(['Tareas especiales',[p.te.real?p.te.real+' hecha'+(p.te.real===1?'':'s'):'',p.te.proc?'1 en curso':'',p.te.pend?p.te.pend+' por hacer':''].filter(Boolean).join(' · ')]);
  if(p.te&&p.te.proc)fil.push(['En curso',esc(p.te.proc.tarea)]);
  const ubic=p.approx==='mun'?'Ubicación aproximada: municipio '+esc(p.mun):p.approx?'Ubicación aproximada: centro de sus tareas':'';
  return `<div class="pp" style="--c:var(${col})"><div class="pp-h"><b>${esc(p.nombre)}</b><span class="badge">${st.l}</span></div>`+
    `<div class="pp-s">${tipoDe(p)[1].replace(/ de Zona Limpia$/,'')}</div>`+
    `<dl>${fil.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join('')}</dl>`+(ubic?`<div class="pp-n">${ubic}</div>`:'')+`</div>`;
}
function etiquetas(arr,obst){
  if(!arr.length)return;
  CTX=CTX||document.createElement('canvas').getContext('2d');
  CTX.font='600 11.5px "DM Sans",system-ui,sans-serif';
  const size=MAP.getSize(),occ=[];
  const libre=a=>a.x>=2&&a.y>=2&&a.x2<=size.x-2&&a.y2<=size.y-2&&!occ.some(b=>a.x<b.x2&&a.x2>b.x&&a.y<b.y2&&a.y2>b.y);
  const mp=$('map').getBoundingClientRect();
  for(const el of [$('clock'),document.querySelector('.mtools')]){const ck=el.getBoundingClientRect();occ.push({x:ck.left-mp.left-4,y:ck.top-mp.top-4,x2:ck.right-mp.left+4,y2:ck.bottom-mp.top+4})}
  for(const o of obst){const c=MAP.latLngToContainerPoint(o.pos),r=o.sz/2;occ.push({x:c.x-r,y:c.y-r,x2:c.x+r,y2:c.y+r})}   // todos los marcadores, no solo los que llevan nombre
  for(const o of arr)o.c=MAP.latLngToContainerPoint(o.p.pos);
  const pri=st=>({sin_tarea:0,parado:1,pocas:2,sin_marca:3})[st]??4;
  arr.sort((a,b)=>pri(a.p.st)-pri(b.p.st));
  const line=cv('--mute');
  for(const o of arr){
    const w=Math.ceil(CTX.measureText(o.txt).width)+16,h=19,r=o.sz/2+2,{x,y}=o.c;
    let box=null,lejos=false;
    for(let k=0;k<16&&!box;k++){
      const d=k*12,dg=(r+d)*.72;
      const cands=[[x+r+d,y-h/2],[x-r-d-w,y-h/2],[x-w/2,y-r-d-h],[x-w/2,y+r+d],[x+dg,y-dg-h],[x-dg-w,y-dg-h],[x+dg,y+dg],[x-dg-w,y+dg]];
      if(k>2)for(let t=0;t<16;t++){const an=t/16*2*Math.PI,R=r+d+8;cands.push([x+R*Math.cos(an)-w/2,y+R*Math.sin(an)-h/2])}
      for(const [lx,ly] of cands){const a={x:lx,y:ly,x2:lx+w,y2:ly+h};if(libre(a)){box=a;lejos=k>1;break}}
    }
    if(!box)continue;   // no hay ningún lugar libre cerca: el nombre se ve al pasar el mouse o al acercar
    occ.push(box);
    if(lejos){
      const px=Math.max(box.x,Math.min(x,box.x2)),py=Math.max(box.y,Math.min(y,box.y2));
      L.polyline([o.p.pos,MAP.containerPointToLatLng([px,py])],{pane:'etq',color:line,weight:1,opacity:.6,interactive:false}).addTo(LAY);
    }
    L.marker(MAP.containerPointToLatLng([box.x,box.y]),{pane:'etq',interactive:false,keyboard:false,
      icon:L.divIcon({className:'nl',html:esc(o.txt),iconSize:[w,h],iconAnchor:[0,0]})}).addTo(LAY);
  }
}
